<!DOCTYPE html>
<!--
  CA 证书管理系统 — 登录页
  与 index.html 共用 style.css；本页逻辑很小，直接内联，不依赖 app.js。
  接口：POST /api/login {username,password} → {username}
        GET  /api/me → {username}（已登录则直接跳转主应用）
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · CA 证书管理系统</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script src="theme-boot.js"></script>
</head>
<body class="login-body">

<main class="login-wrap">
  <form class="login-card" id="loginForm" autocomplete="on" novalidate>
    <div class="login-brand">
      <svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true" class="login-ico">
        <path fill="currentColor" d="M12 1.6 3.6 5v6.4c0 5.2 3.6 9.6 8.4 11 4.8-1.4 8.4-5.8 8.4-11V5L12 1.6Zm0 2.2 6.4 2.6v5c0 4.1-2.7 7.7-6.4 8.9-3.7-1.2-6.4-4.8-6.4-8.9v-5L12 3.8Zm-.9 3.6v4.1L8 13.6l1.1 1.6 3.9-2.7V7.4h-1.9Z"/>
      </svg>
      <h1>CA 证书管理系统</h1>
      <p class="muted">请使用管理员账号登录</p>
    </div>

    <div class="alert alert-error" id="loginError" hidden></div>

    <div class="field">
      <label for="username">用户名</label>
      <input id="username" name="username" class="input" type="text" autocomplete="username"
             required autofocus placeholder="admin">
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input id="password" name="password" class="input" type="password" autocomplete="current-password"
             required placeholder="请输入密码">
    </div>

    <button class="btn btn-primary btn-block" id="loginBtn" type="submit">登录</button>

    <div class="sec-line">
      <span class="dot" id="secDot"></span>
      <span id="secText" class="muted small">正在建立加密信道…</span>
      <span class="spacer"></span>
      <button class="btn btn-ghost btn-sm" id="selfCheckBtn" type="button" title="检查加密模块 / 接口 / 信道是否正常">自检</button>
      <button class="btn btn-ghost btn-sm" id="secReset" type="button" hidden title="仅当服务器确实更换过信道密钥时使用">重置指纹</button>
    </div>

    <p class="muted small login-foot">
      口令通过应用层加密信道（X25519 + XSalsa20-Poly1305）传输，不依赖 HTTPS。
      指纹请与服务器启动日志核对：
      <span class="mono" id="secFingerprint">—</span>
      <span class="sep">·</span>
      <a href="#" id="themeToggle">切换深色模式</a>
    </p>
  </form>
</main>

<script src="vendor/tweetnacl.min.js"></script>
<script src="crypto.js"></script>
<script src="login.js"></script>
</body>
</html>
